<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown attachment preview harness</title><link rel="stylesheet" href="bundle.css"><style>
body{margin:0;font:15px system-ui;background:var(--background-tertiary);color:var(--text-default);--font-primary:system-ui;--font-code:ui-monospace,monospace;--brand-500:#5865f2;--text-link:#00a8fc}
body.dark{--background-tertiary:#1e1f22;--background-secondary:#2b2d31;--background-surface-high:#35373c;--background-code:#202225;--text-default:#dbdee1;--text-strong:#f2f3f5;--text-muted:#949ba4;--border-subtle:#41434a}
body.light{--background-tertiary:#e3e5e8;--background-secondary:#fff;--background-surface-high:#f2f3f5;--background-code:#f2f3f5;--text-default:#313338;--text-strong:#060607;--text-muted:#5c5e66;--border-subtle:#d3d5d8;--text-link:#0069c2}
main{max-width:850px;margin:40px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0 0 8px}header p{color:var(--text-muted);font-size:13px}.card{background:var(--background-secondary);border:1px solid var(--border-subtle);border-radius:8px;margin:20px 0;overflow:hidden}.native-raw{margin:0;padding:16px;max-height:380px;overflow:auto;white-space:pre-wrap;font:13px var(--font-code)}footer{padding:10px 16px;border-top:1px solid var(--border-subtle);color:var(--text-muted);font-size:12px}footer a{color:var(--text-link)}button{font:inherit;cursor:pointer}header button,.harness-controls button{border:1px solid var(--border-subtle);border-radius:4px;padding:6px 12px;background:var(--background-secondary);color:var(--text-default)}.harness-controls{display:flex;gap:8px}
</style></head><body class="dark"><div id="root"></div><script type="module" src="bundle.js"></script></body></html>
